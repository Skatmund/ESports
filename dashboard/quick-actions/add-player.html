<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Player | ArenaHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/dashboard-design.css">
    <link rel="stylesheet" href="../../assets/css/add-player.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-top">
            <div class="logo">

                <div class="logo-icon">🎮</div>

                <h2>ArenaHub</h2>

            </div>
            <ul class="sidebar-menu">

                <li>
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </li>

                <li>
                    <i data-lucide="trophy"></i>
                    <span>Tournaments</span>
                </li>

                <li>
                    <i data-lucide="users"></i>
                    <span>Teams</span>
                </li>

                <li class="active">
                    <i data-lucide="user-round"></i>
                    <span>Players</span>
                </li>

                <li>
                    <i data-lucide="gamepad-2"></i>
                    <span>Games</span>
                </li>

                <li>
                    <i data-lucide="calendar-days"></i>
                    <span>Schedule</span>
                </li>

                <li>
                    <i data-lucide="git-branch"></i>
                    <span>Brackets</span>
                </li>

                <li>
                    <i data-lucide="bar-chart-3"></i>
                    <span>Analytics</span>
                </li>
            </ul>
        </div>

    </aside>

    <main class="main-content">

        <header class="page-header">

            <h1>Add Player</h1>

            <p>Register a new player into the ArenaHub database.</p>

        </header>

        <form class="player-form">

            <!-- PERSONAL INFORMATION -->

            <div class="form-card">

                <h2>Personal Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@email.com">
                    </div>

                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" placeholder="+63 912 345 6789">
                    </div>

                </div>

            </div>

            <!-- PLAYER INFORMATION -->

            <div class="form-card">

                <h2>Player Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>In-Game Name (IGN)</label>
                        <input type="text" placeholder="Shadow">
                    </div>

                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" placeholder="shadow123">
                    </div>

                    <div class="form-group">
                        <label>Game</label>

                        <select>
                            <option>Valorant</option>
                            <option>Counter-Strike 2</option>
                            <option>Dota 2</option>
                            <option>League of Legends</option>
                            <option>Mobile Legends</option>
                            <option>Left 4 Dead 2</option>
                        </select>

                    </div>

                    <div class="form-group">
                        <label>Team</label>

                        <select>
                            <option>Team Alpha</option>
                            <option>Team Nova</option>
                            <option>Team Eclipse</option>
                            <option>Unassigned</option>
                        </select>

                    </div>

                    <div class="form-group">
                        <label>Role</label>

                        <select>
                            <option>Duelist</option>
                            <option>Initiator</option>
                            <option>Controller</option>
                            <option>Sentinel</option>
                            <option>Support</option>
                            <option>Carry</option>
                            <option>Tank</option>
                        </select>

                    </div>

                    <div class="form-group">
                        <label>Current Rank</label>

                        <select>
                            <option>Radiant</option>
                            <option>Immortal</option>
                            <option>Ascendant</option>
                            <option>Diamond</option>
                            <option>Platinum</option>
                            <option>Gold</option>
                            <option>Silver</option>
                            <option>Bronze</option>
                        </select>

                    </div>

                </div>

            </div>

            <!-- PROFILE -->

            <div class="form-card">

                <h2>Player Profile</h2>

                <div class="upload-box">

                    <i data-lucide="image-plus"></i>

                    <p>Upload Player Photo</p>

                    <input type="file">

                </div>

            </div>

            <!-- BIO -->

            <div class="form-card">

                <h2>Biography</h2>

                <div class="form-group">

                    <label>About the Player</label>

                    <textarea rows="6"
                        placeholder="Tell us something about this player..."></textarea>

                </div>

            </div>

            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    type="button"
                    class="cancel-btn">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="create-btn">

                    <i data-lucide="user-plus"></i>

                    Add Player

                </button>

            </div>

        </form>

    </main>

</div>

<script>

lucide.createIcons();

</script>

</body>

</html>
