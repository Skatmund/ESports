<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArenaHub | Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/landingpage/landing-design.css">
    <link rel="stylesheet" href="assets/css/register/register-design.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar auth-navbar">

    <div class="container navbar-content">

        <div class="brand">
            <div class="brand-icon">🎮</div>
            <h1>ArenaHub</h1>
        </div>

        <div class="nav-actions">
            <a href="landingpage.html" class="btn btn-outline">Home</a>
        </div>

    </div>

</nav>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-left">

            <div class="brand">
                <div class="brand-icon">🎮</div>
                <h1>ArenaHub</h1>
            </div>

            <h2>Welcome to ArenaHub</h2>

            <p>
                Organize tournaments, manage teams,
                and compete in the next generation of esports.
            </p>

            <div class="stats">

                <div class="stat-box">
                    <h3>500+</h3>
                    <span>Tournaments</span>
                </div>

                <div class="stat-box">
                    <h3>10K+</h3>
                    <span>Players</span>
                </div>

                <div class="stat-box">
                    <h3>300+</h3>
                    <span>Teams</span>
                </div>

            </div>

        </div>

        <div class="auth-right">

            <div class="auth-header">

                <h2>Create Account</h2>

                <p>
                    Join the ArenaHub community.
                </p>

            </div>
            <form class="auth-form">

                <div class="input-row">

                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John">
                    </div>

                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe">
                    </div>

                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@email.com">
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="john123">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Password</label>
                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Password">

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="password">

                                <i data-lucide="eye"></i>

                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="password-box">
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm Password">

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="confirmPassword">

                                <i data-lucide="eye"></i>

                            </button>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Account Role</label>

                    <select>

                        <option>Player</option>
                        <option>Team Manager</option>
                        <option>Tournament Organizer</option>

                    </select>

                </div>

                <div class="checkbox-group">

                    <input type="checkbox">

                    <label>
                        I agree to the Terms and Privacy Policy
                    </label>

                </div>

                <button class="btn btn-primary auth-btn">
                    Create Account
                </button>
                <div class="auth-footer">
                    <p>
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </div>
            </form>
        </div>

    </div>


</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="assets/js/register/auth.js"></script>

</body>
</html>
